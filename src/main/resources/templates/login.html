<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Management System - Login</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="car-mark">🚘</div><h1>Car Management System</h1>
    <p class="muted">Sign in to manage your cars</p>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/login}" method="post">
      <label>Username</label><input name="username" placeholder="Username" required autofocus>
      <label>Password</label><input type="password" name="password" placeholder="Password" required>
      <button class="btn primary full" type="submit">Login</button>
    </form>
    <p class="hint">Demo login: <b>admin</b> / <b>admin123</b></p>
  </main>
</body></html>
