<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add Car</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app-body"><div class="layout"><div th:replace="~{fragments/sidebar :: sidebar('add')}"></div>
<main class="main"><header class="topbar"><b>Car Management System</b><a th:href="@{/logout}">Logout</a></header>
<section class="content"><h1>Add Car</h1><p class="muted">Fill in the details to add a new car</p>
<form class="form-card" th:action="@{/cars/add}" th:object="${car}" method="post" enctype="multipart/form-data">
<div class="form-fields">
<div class="field"><label>Car Name</label><input th:field="*{name}" placeholder="e.g. Swift"><small class="field-error" th:errors="*{name}"></small></div>
<div class="field"><label>Company</label><input th:field="*{company}" placeholder="e.g. Maruti Suzuki"><small class="field-error" th:errors="*{company}"></small></div>
<div class="field"><label>Color</label><input th:field="*{color}" placeholder="e.g. White"><small class="field-error" th:errors="*{color}"></small></div>
<div class="field"><label>Price (INR)</label><input type="number" min="1" step="0.01" th:field="*{price}" placeholder="650000"><small class="field-error" th:errors="*{price}"></small></div>
<div class="field"><label>Car Image</label><input type="file" name="image" accept="image/png,image/jpeg,image/webp"><small class="muted">Optional · JPG, PNG or WEBP · max 5 MB</small></div>
<div class="alert error" th:if="${uploadError}" th:text="${uploadError}"></div>
<button class="btn success full" type="submit">＋ &nbsp; Add Car</button>
</div><div class="image-note"><div class="car-mark">🚙</div><b>Car photo</b><p class="muted">Choose an image file to display it in the car list.</p></div>
</form></section></main></div></body></html>
